name: Build and publish Deepnote Remote Coder

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/deepnote-remote-coder:v4
            ${{ secrets.DOCKERHUB_USERNAME }}/deepnote-remote-coder:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test image
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/deepnote-remote-coder:v4
          REMOTE_IDE_PASSWORD: "CI-only-RemoteCoder-8472-Test!"
        run: |
          set -euo pipefail

          docker run -d \
            --name remote-coder-test \
            -e REMOTE_IDE_PASSWORD="$REMOTE_IDE_PASSWORD" \
            "$IMAGE" \
            bash -lc 'python /opt/remote-ide/remote_ide_manager.py serve'

          cleanup() {
            docker logs remote-coder-test || true
            docker rm -f remote-coder-test || true
          }
          trap cleanup EXIT

          echo "Waiting for code-server..."
          for i in $(seq 1 60); do
            if docker exec remote-coder-test \
              bash -lc 'curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1'; then
              echo "code-server is running."
              break
            fi

            if [ "$i" -eq 60 ]; then
              echo "Timed out."
              exit 1
            fi

            sleep 2
          done

          docker exec remote-coder-test \
            bash -lc 'python /opt/remote-ide/deepnote-smoke-test.py'

          docker exec remote-coder-test \
            bash -lc '
              test -f /work/.remote-ide/config.yaml
              grep -q "^auth: password$" /work/.remote-ide/config.yaml
              test -s /work/.remote-ide/password.txt
              grep -Fq "CI-only-RemoteCoder-8472-Test!" /work/.remote-ide/password.txt
            '

          status_code="$(docker exec remote-coder-test \
            bash -lc 'curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/')"

          test "$status_code" = "401"

      - name: Push tested image
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/deepnote-remote-coder
        run: |
          docker push "$IMAGE:v4"
          docker push "$IMAGE:latest"
